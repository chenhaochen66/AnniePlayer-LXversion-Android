name: android-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  annieplayer:
    name: AnniePlayer 构建 + 单测
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: 预取 Gradle 分发（国内镜像不可达时回退官方源）
        working-directory: android-native
        run: |
          if ! timeout 300 ./gradlew --version > /dev/null 2>&1; then
            sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
            ./gradlew --version > /dev/null
          fi

      - name: assembleDebug
        working-directory: android-native
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: testDebugUnitTest
        working-directory: android-native
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: 记录产物与单测结果
        working-directory: android-native
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK=$APK"
          echo "APK_BYTES=$SIZE"
          echo "APK_SHA256=$HASH"
          {
            echo "## AnniePlayer"
            echo ""
            echo "产物：\`app-debug.apk\`（runner 自动生成的 debug keystore 签名，**不含发布密钥**，不可对外发布）"
            echo ""
            echo '```'
            echo "$SIZE bytes  $APK"
            echo "$HASH  $APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          tests = failures = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests") or 0)
              failures += int(root.get("failures") or 0) + int(root.get("errors") or 0)
              skipped += int(root.get("skipped") or 0)
          print(f"TESTS={tests} FAILURES={failures} SKIPPED={skipped}")
          with open(sys.argv[1], "a", encoding="utf-8") as out:
              out.write(f"\n单测：{tests} 例，失败 {failures}，跳过 {skipped}\n")
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: annieplayer-debug-${{ github.sha }}
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  wrapperlite:
    name: WrapperLite 构建
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 预取 Gradle 分发（国内镜像不可达时回退官方源）
        working-directory: android-native/wrapper-lite-app
        run: |
          if ! timeout 300 ./gradlew --version > /dev/null 2>&1; then
            sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
            ./gradlew --version > /dev/null
          fi

      - name: assembleDebug
        working-directory: android-native/wrapper-lite-app
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: 记录产物
        working-directory: android-native/wrapper-lite-app
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK=$APK"
          echo "APK_BYTES=$SIZE"
          echo "APK_SHA256=$HASH"
          {
            echo "## WrapperLite"
            echo ""
            echo "产物：\`app-debug.apk\`（runner 自动生成的 debug keystore 签名，**不含发布密钥**，不可对外发布）"
            echo ""
            echo '```'
            echo "$SIZE bytes  $APK"
            echo "$HASH  $APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release-guard:
    name: release 缺 keystore 必须硬失败
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: 预取 Gradle 分发（两个工程）
        run: |
          for dir in android-native android-native/wrapper-lite-app; do
            cd "$GITHUB_WORKSPACE/$dir"
            if ! timeout 300 ./gradlew --version > /dev/null 2>&1; then
              sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
              ./gradlew --version > /dev/null
            fi
          done

      - name: 主程序 assembleRelease 必须失败
        working-directory: android-native
        run: |
          set -euo pipefail
          if ./gradlew :app:assembleRelease --console=plain 2>&1 | tee /tmp/release.log; then
            echo "缺少 keystore.properties 时 assembleRelease 仍然成功，签名守卫失效" >&2
            exit 1
          fi
          grep -q "release 构建必须提供 keystore.properties" /tmp/release.log
          {
            echo "## release 签名守卫"
            echo ""
            echo '两个工程在无 `keystore.properties` 时 `:app:assembleRelease` 均按预期失败，未回退 debug 签名。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: wrapper-lite assembleRelease 必须失败
        working-directory: android-native/wrapper-lite-app
        run: |
          set -euo pipefail
          if ./gradlew :app:assembleRelease --console=plain 2>&1 | tee /tmp/wrapper-release.log; then
            echo "缺少 keystore.properties 时 assembleRelease 仍然成功，签名守卫失效" >&2
            exit 1
          fi
          grep -q "release 构建必须提供 keystore.properties" /tmp/wrapper-release.log
